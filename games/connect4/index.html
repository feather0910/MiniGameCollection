<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>四子棋</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .board-wrap { width: min(94vw, 490px); }
  #grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    background: #1d4ed8;
    border: 4px solid #1e40af;
    border-radius: var(--radius);
    padding: 10px;
  }
  .hole {
    aspect-ratio: 1;
    border-radius: 50%;
    background: #0b1120;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .piece {
    width: 88%; height: 88%;
    border-radius: 50%;
    animation: drop 0.35s ease-in;
  }
  @keyframes drop { from { transform: translateY(-300%); } to { transform: translateY(0); } }
  .piece.p1 { background: radial-gradient(circle at 32% 30%, #fca5a5, #dc2626 70%); }
  .piece.p2 { background: radial-gradient(circle at 32% 30%, #fde68a, #d97706 70%); }
  .hole.win { box-shadow: 0 0 0 4px #4ade80, 0 0 16px #4ade80; }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>🔴 四子棋</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>
  <div class="hud">
    <div class="stat"><div class="label">轮到</div><div class="value" id="turn">你</div></div>
    <div class="stat"><div class="label">战绩</div><div class="value" id="record">0胜 0负</div></div>
    <button class="btn" id="restart">重新开始</button>
  </div>
  <div class="board-wrap">
    <div id="grid"></div>
    <div class="overlay hidden" id="overlay">
      <h2 id="ov-title"></h2>
      <p id="ov-msg"></p>
      <button class="btn" id="ov-btn">再来一局</button>
    </div>
  </div>
  <p class="hint">点击任意一列投子，棋子会落到该列最底部<br>横、竖、斜先连成 4 子者获胜（你是红方）</p>
</div>
<script>
(() => {
  const ROWS = 6, COLS = 7, HUMAN = 1, AI = 2;
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  const REC_KEY = 'connect4_record';
  let board, busy, over, winCells;
  let record = JSON.parse(localStorage.getItem(REC_KEY) || '{"win":0,"lose":0}');

  function init() {
    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    busy = false;
    over = false;
    winCells = [];
    $('turn').textContent = '你';
    $('overlay').classList.add('hidden');
    updateRecord();
    render();
  }

  function updateRecord() {
    $('record').textContent = `${record.win}胜 ${record.lose}负`;
  }

  function render(newCell) {
    grid.innerHTML = '';
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const h = document.createElement('div');
        h.className = 'hole';
        if (winCells.some(([wr, wc]) => wr === r && wc === c)) h.classList.add('win');
        if (board[r][c]) {
          const p = document.createElement('div');
          p.className = 'piece p' + board[r][c];
          if (!(newCell && newCell[0] === r && newCell[1] === c)) p.style.animation = 'none';
          h.appendChild(p);
        }
        h.addEventListener('click', () => onCol(c));
        grid.appendChild(h);
      }
  }

  function dropRow(b, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (!b[r][c]) return r;
    return -1;
  }

  function winner(b, r, c) {
    const who = b[r][c];
    for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
      const cells = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && cc >= 0 && rr < ROWS && cc < COLS && b[rr][cc] === who) {
          cells.push([rr, cc]);
          rr += dr * s; cc += dc * s;
        }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }

  function onCol(c) {
    if (busy || over) return;
    const r = dropRow(board, c);
    if (r < 0) return;
    board[r][c] = HUMAN;
    render([r, c]);
    const w = winner(board, r, c);
    if (w) return end(HUMAN, w);
    if (full()) return end(0);
    busy = true;
    $('turn').textContent = 'AI';
    setTimeout(() => {
      const col = bestMove();
      const rr = dropRow(board, col);
      board[rr][col] = AI;
      busy = false;
      $('turn').textContent = '你';
      render([rr, col]);
      const w2 = winner(board, rr, col);
      if (w2) return end(AI, w2);
      if (full()) return end(0);
    }, 400);
  }

  const full = () => board[0].every(v => v);

  // ------- AI：alpha-beta 极大极小 -------
  function evalWindow(w) {
    const ai = w.filter(v => v === AI).length;
    const hu = w.filter(v => v === HUMAN).length;
    if (ai && hu) return 0;
    if (ai === 4) return 100000;
    if (hu === 4) return -100000;
    if (ai === 3) return 120;
    if (ai === 2) return 12;
    if (hu === 3) return -140;
    if (hu === 2) return -12;
    return 0;
  }

  function evaluate(b) {
    let s = 0;
    // 中心偏好
    for (let r = 0; r < ROWS; r++) {
      if (b[r][3] === AI) s += 6;
      else if (b[r][3] === HUMAN) s -= 6;
    }
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        if (c + 3 < COLS) s += evalWindow([b[r][c], b[r][c+1], b[r][c+2], b[r][c+3]]);
        if (r + 3 < ROWS) s += evalWindow([b[r][c], b[r+1][c], b[r+2][c], b[r+3][c]]);
        if (r + 3 < ROWS && c + 3 < COLS) s += evalWindow([b[r][c], b[r+1][c+1], b[r+2][c+2], b[r+3][c+3]]);
        if (r + 3 < ROWS && c - 3 >= 0) s += evalWindow([b[r][c], b[r+1][c-1], b[r+2][c-2], b[r+3][c-3]]);
      }
    return s;
  }

  const ORDER = [3, 2, 4, 1, 5, 0, 6];

  function minimax(b, depth, alpha, beta, maximizing, lastR, lastC) {
    if (lastR !== undefined) {
      const w = winner(b, lastR, lastC);
      if (w) return b[lastR][lastC] === AI ? 1000000 - (6 - depth) : -1000000 + (6 - depth);
    }
    if (depth === 0) return evaluate(b);
    let moved = false;
    let best = maximizing ? -Infinity : Infinity;
    for (const c of ORDER) {
      const r = dropRow(b, c);
      if (r < 0) continue;
      moved = true;
      b[r][c] = maximizing ? AI : HUMAN;
      const v = minimax(b, depth - 1, alpha, beta, !maximizing, r, c);
      b[r][c] = 0;
      if (maximizing) {
        best = Math.max(best, v);
        alpha = Math.max(alpha, v);
      } else {
        best = Math.min(best, v);
        beta = Math.min(beta, v);
      }
      if (beta <= alpha) break;
    }
    return moved ? best : 0; // 平局
  }

  function bestMove() {
    let best = -Infinity, bestCol = ORDER.find(c => dropRow(board, c) >= 0);
    for (const c of ORDER) {
      const r = dropRow(board, c);
      if (r < 0) continue;
      board[r][c] = AI;
      const v = minimax(board, 5, -Infinity, Infinity, false, r, c);
      board[r][c] = 0;
      if (v > best) { best = v; bestCol = c; }
    }
    return bestCol;
  }

  function end(who, cells = []) {
    over = true;
    winCells = cells;
    render();
    if (who === HUMAN) { record.win++; $('ov-title').textContent = '🎉 你赢了！'; }
    else if (who === AI) { record.lose++; $('ov-title').textContent = '😅 AI 获胜'; }
    else $('ov-title').textContent = '平局';
    localStorage.setItem(REC_KEY, JSON.stringify(record));
    updateRecord();
    $('ov-msg').textContent = who ? '' : '棋盘下满了';
    setTimeout(() => $('overlay').classList.remove('hidden'), 700);
  }

  $('restart').addEventListener('click', init);
  $('ov-btn').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
