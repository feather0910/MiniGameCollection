<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五子棋</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .board-wrap { width: min(94vw, 540px); }
  #board { width: 100%; height: auto; border-radius: var(--radius); cursor: pointer; }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>⚫ 五子棋</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>
  <div class="hud">
    <div class="stat"><div class="label">当前</div><div class="value" id="turn">你（黑）</div></div>
    <div class="stat"><div class="label">战绩</div><div class="value" id="record">0胜 0负</div></div>
    <button class="btn secondary" id="undo">悔棋</button>
    <button class="btn" id="restart">重新开始</button>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="540" height="540"></canvas>
    <div class="overlay hidden" id="overlay">
      <h2 id="ov-title"></h2>
      <p id="ov-msg"></p>
      <button class="btn" id="ov-btn">再来一局</button>
    </div>
  </div>
  <p class="hint">你执黑先行，点击交叉点落子，横竖斜先连成五子者胜</p>
</div>
<script>
(() => {
  const N = 15, S = 540, PAD = 24, GAP = (S - PAD * 2) / (N - 1);
  const $ = id => document.getElementById(id);
  const cv = $('board'), ctx = cv.getContext('2d');
  const REC_KEY = 'gomoku_record';
  const HUMAN = 1, AI = 2;
  let board, history, gameOver, thinking;
  let record = JSON.parse(localStorage.getItem(REC_KEY) || '{"win":0,"lose":0}');

  function init() {
    board = Array.from({length: N}, () => Array(N).fill(0));
    history = [];
    gameOver = false;
    thinking = false;
    $('turn').textContent = '你（黑）';
    $('overlay').classList.add('hidden');
    updateRecord();
    draw();
  }

  function updateRecord() {
    $('record').textContent = `${record.win}胜 ${record.lose}负`;
  }

  function draw(lastMove) {
    ctx.fillStyle = '#d9a662';
    ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = '#7c4a1e';
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      ctx.beginPath();
      ctx.moveTo(PAD, PAD + i * GAP); ctx.lineTo(S - PAD, PAD + i * GAP);
      ctx.moveTo(PAD + i * GAP, PAD); ctx.lineTo(PAD + i * GAP, S - PAD);
      ctx.stroke();
    }
    // 星位
    ctx.fillStyle = '#7c4a1e';
    for (const [r, c] of [[3,3],[3,11],[11,3],[11,11],[7,7]]) {
      ctx.beginPath();
      ctx.arc(PAD + c * GAP, PAD + r * GAP, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // 棋子
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        if (!board[r][c]) continue;
        const x = PAD + c * GAP, y = PAD + r * GAP;
        const g = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, GAP * 0.44);
        if (board[r][c] === HUMAN) { g.addColorStop(0, '#555'); g.addColorStop(1, '#0a0a0a'); }
        else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#c8c8c8'); }
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, GAP * 0.44, 0, Math.PI * 2);
        ctx.fill();
      }
    // 最后一手标记
    const last = lastMove || history[history.length - 1];
    if (last) {
      const x = PAD + last[1] * GAP, y = PAD + last[0] * GAP;
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 5, y - 5, 10, 10);
    }
  }

  function checkWin(r, c, who) {
    for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
      let n = 1;
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && cc >= 0 && rr < N && cc < N && board[rr][cc] === who) {
          n++; rr += dr * s; cc += dc * s;
        }
      }
      if (n >= 5) return true;
    }
    return false;
  }

  // 评估某空点对 who 的价值（四个方向的连子模式打分）
  function scorePoint(r, c, who) {
    let total = 0;
    for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
      let count = 1, blocks = 0;
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && cc >= 0 && rr < N && cc < N && board[rr][cc] === who) {
          count++; rr += dr * s; cc += dc * s;
        }
        if (rr < 0 || cc < 0 || rr >= N || cc >= N || board[rr][cc] !== 0) blocks++;
      }
      if (count >= 5) total += 1000000;
      else if (count === 4) total += blocks === 0 ? 100000 : (blocks === 1 ? 10000 : 0);
      else if (count === 3) total += blocks === 0 ? 5000 : (blocks === 1 ? 500 : 0);
      else if (count === 2) total += blocks === 0 ? 200 : (blocks === 1 ? 30 : 0);
      else total += blocks === 0 ? 20 : 1;
    }
    return total;
  }

  function aiMove() {
    let best = -1, bestMoves = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        if (board[r][c]) continue;
        if (!hasNeighbor(r, c)) continue;
        // 进攻分 + 防守分（防守略降权，倾向进攻）
        const s = scorePoint(r, c, AI) + scorePoint(r, c, HUMAN) * 0.9;
        if (s > best) { best = s; bestMoves = [[r, c]]; }
        else if (s === best) bestMoves.push([r, c]);
      }
    if (!bestMoves.length) bestMoves = [[7, 7]];
    const [r, c] = bestMoves[Math.floor(Math.random() * bestMoves.length)];
    place(r, c, AI);
  }

  function hasNeighbor(r, c) {
    for (let dr = -2; dr <= 2; dr++)
      for (let dc = -2; dc <= 2; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && cc >= 0 && rr < N && cc < N && board[rr][cc]) return true;
      }
    return false;
  }

  function place(r, c, who) {
    board[r][c] = who;
    history.push([r, c, who]);
    draw();
    if (checkWin(r, c, who)) {
      gameOver = true;
      if (who === HUMAN) { record.win++; end('🎉 你赢了！', '恭喜战胜 AI'); }
      else { record.lose++; end('😅 AI 获胜', '再接再厉！'); }
      localStorage.setItem(REC_KEY, JSON.stringify(record));
      updateRecord();
      return;
    }
    if (history.length === N * N) {
      gameOver = true;
      end('平局', '棋盘下满了');
      return;
    }
    $('turn').textContent = who === HUMAN ? 'AI（白）' : '你（黑）';
  }

  function end(title, msg) {
    $('ov-title').textContent = title;
    $('ov-msg').textContent = msg;
    setTimeout(() => $('overlay').classList.remove('hidden'), 400);
  }

  cv.addEventListener('click', e => {
    if (gameOver || thinking) return;
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * S;
    const y = (e.clientY - rect.top) / rect.height * S;
    const c = Math.round((x - PAD) / GAP), r = Math.round((y - PAD) / GAP);
    if (r < 0 || c < 0 || r >= N || c >= N || board[r][c]) return;
    place(r, c, HUMAN);
    if (gameOver) return;
    thinking = true;
    setTimeout(() => { aiMove(); thinking = false; }, 220);
  });

  $('undo').addEventListener('click', () => {
    if (thinking || history.length < 2) return;
    // 撤销 AI 与玩家各一手
    for (let i = 0; i < 2; i++) {
      const m = history.pop();
      if (m) board[m[0]][m[1]] = 0;
    }
    gameOver = false;
    $('overlay').classList.add('hidden');
    $('turn').textContent = '你（黑）';
    draw();
  });

  $('restart').addEventListener('click', init);
  $('ov-btn').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
