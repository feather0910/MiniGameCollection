<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>汉诺塔</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .board-wrap { width: min(94vw, 620px); }
  #pegs {
    display: flex;
    gap: 10px;
    background: #0b1120;
    border: 1px solid #334155;
    border-radius: var(--radius);
    padding: 20px 10px 0;
  }
  .peg {
    flex: 1;
    height: 300px;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    position: relative;
    cursor: pointer;
    border-radius: 10px;
    padding-bottom: 14px;
  }
  .peg::before { /* 柱子 */
    content: '';
    position: absolute;
    bottom: 14px;
    width: 10px;
    height: 240px;
    background: #475569;
    border-radius: 5px 5px 0 0;
  }
  .peg::after { /* 底座 */
    content: '';
    position: absolute;
    bottom: 6px;
    width: 92%;
    height: 10px;
    background: #475569;
    border-radius: 5px;
  }
  .peg.sel { background: rgba(56, 189, 248, 0.09); box-shadow: inset 0 0 0 2px rgba(56, 189, 248, 0.5); }
  .disk {
    height: 26px;
    border-radius: 13px;
    margin-top: 4px;
    z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.55);
    transition: transform 0.15s;
  }
  .disk.lifted { transform: translateY(-14px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
  select {
    background: var(--bg2); color: var(--text); border: 1px solid #334155;
    border-radius: 999px; padding: 8px 14px; font-family: inherit; font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>🗼 汉诺塔</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>
  <div class="hud">
    <div class="stat"><div class="label">步数</div><div class="value" id="moves">0</div></div>
    <div class="stat"><div class="label">最少步数</div><div class="value" id="min">7</div></div>
    <select id="count">
      <option value="3">3 层</option>
      <option value="4" selected>4 层</option>
      <option value="5">5 层</option>
      <option value="6">6 层</option>
      <option value="7">7 层</option>
      <option value="8">8 层</option>
    </select>
    <button class="btn" id="restart">重新开始</button>
  </div>
  <div class="board-wrap">
    <div id="pegs">
      <div class="peg" data-i="0"></div>
      <div class="peg" data-i="1"></div>
      <div class="peg" data-i="2"></div>
    </div>
    <div class="overlay hidden" id="overlay">
      <h2>🎉 完成！</h2>
      <p id="ov-msg"></p>
      <button class="btn" id="ov-btn">再来一局</button>
    </div>
  </div>
  <p class="hint">把所有圆盘从左柱移到右柱：点一下选中柱顶圆盘，再点目标柱放下<br>大盘不能压在小盘上面</p>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const COLORS = ['#f87171','#fb923c','#facc15','#4ade80','#38bdf8','#a78bfa','#f472b6','#94a3b8'];
  let pegs, n, moves, from;

  function init() {
    n = +$('count').value;
    pegs = [Array.from({length: n}, (_, i) => n - i), [], []]; // 数字越大盘越大
    moves = 0;
    from = null;
    $('moves').textContent = 0;
    $('min').textContent = Math.pow(2, n) - 1;
    $('overlay').classList.add('hidden');
    render();
  }

  function render() {
    document.querySelectorAll('.peg').forEach((el, i) => {
      el.innerHTML = '';
      el.classList.toggle('sel', from === i);
      const maxW = el.clientWidth * 0.92;
      pegs[i].forEach((size, j) => {
        const d = document.createElement('div');
        d.className = 'disk';
        const w = 36 + (size - 1) / (n - 1 || 1) * (maxW - 40);
        d.style.width = w + 'px';
        d.style.background = COLORS[(size - 1) % COLORS.length];
        d.textContent = size;
        if (from === i && j === pegs[i].length - 1) d.classList.add('lifted');
        el.appendChild(d);
      });
    });
  }

  function onPeg(i) {
    if (from === null) {
      if (pegs[i].length) { from = i; render(); }
      return;
    }
    if (from === i) { from = null; render(); return; }
    const disk = pegs[from][pegs[from].length - 1];
    const top = pegs[i][pegs[i].length - 1];
    if (top !== undefined && top < disk) {
      // 非法：大压小，闪一下提示
      const el = document.querySelectorAll('.peg')[i];
      el.animate([{background: 'rgba(248,113,113,0.25)'}, {background: 'transparent'}], {duration: 350});
      return;
    }
    pegs[i].push(pegs[from].pop());
    from = null;
    moves++;
    $('moves').textContent = moves;
    render();
    if (pegs[2].length === n) {
      const min = Math.pow(2, n) - 1;
      $('ov-msg').textContent = `${moves} 步完成` + (moves === min ? ' · 最优解！👑' : `（最少 ${min} 步）`);
      setTimeout(() => $('overlay').classList.remove('hidden'), 350);
    }
  }

  document.querySelectorAll('.peg').forEach(el => {
    el.addEventListener('click', () => onPeg(+el.dataset.i));
  });
  $('count').addEventListener('change', init);
  $('restart').addEventListener('click', init);
  $('ov-btn').addEventListener('click', init);
  window.addEventListener('resize', render);
  init();
})();
</script>
</body>
</html>
