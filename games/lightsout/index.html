<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>点灯谜题</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .board-wrap { width: min(92vw, 420px); }
  #grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    background: #0b1120;
    border: 1px solid #334155;
    border-radius: var(--radius);
    padding: 14px;
  }
  .lamp {
    aspect-ratio: 1;
    border-radius: 14px;
    background: #1a2537;
    border: 1px solid #2b3a52;
    cursor: pointer;
    transition: all 0.18s;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(20px, 7vw, 34px);
  }
  .lamp.on {
    background: linear-gradient(145deg, #fbbf24, #f59e0b);
    border-color: #fde68a;
    box-shadow: 0 0 18px rgba(251, 191, 36, 0.55);
  }
  select {
    background: var(--bg2); color: var(--text); border: 1px solid #334155;
    border-radius: 999px; padding: 8px 14px; font-family: inherit; font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>💡 点灯谜题</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>
  <div class="hud">
    <div class="stat"><div class="label">步数</div><div class="value" id="moves">0</div></div>
    <div class="stat"><div class="label">参考步数</div><div class="value" id="par">—</div></div>
    <select id="level">
      <option value="3">简单（3 次打乱）</option>
      <option value="6" selected>中等（6 次打乱）</option>
      <option value="10">困难（10 次打乱）</option>
    </select>
    <button class="btn" id="restart">新谜题</button>
  </div>
  <div class="board-wrap">
    <div id="grid"></div>
    <div class="overlay hidden" id="overlay">
      <h2>💡 全部点亮！</h2>
      <p id="ov-msg"></p>
      <button class="btn" id="ov-btn">再来一题</button>
    </div>
  </div>
  <p class="hint">点击一盏灯会同时翻转它和上下左右四盏<br>把所有灯全部点亮即可获胜</p>
</div>
<script>
(() => {
  const N = 5;
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  let lit, moves, par, done;

  function toggle(state, r, c) {
    for (const [dr, dc] of [[0,0],[0,1],[0,-1],[1,0],[-1,0]]) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && cc >= 0 && rr < N && cc < N) state[rr][cc] = !state[rr][cc];
    }
  }

  function init() {
    lit = Array.from({length: N}, () => Array(N).fill(true)); // 从全亮反推
    par = +$('level').value;
    const pressed = new Set();
    while (pressed.size < par) pressed.add(Math.floor(Math.random() * N * N));
    for (const p of pressed) toggle(lit, Math.floor(p / N), p % N);
    moves = 0;
    done = false;
    $('moves').textContent = 0;
    $('par').textContent = par;
    $('overlay').classList.add('hidden');
    render();
  }

  function render() {
    grid.innerHTML = '';
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        const d = document.createElement('div');
        d.className = 'lamp' + (lit[r][c] ? ' on' : '');
        d.textContent = lit[r][c] ? '💡' : '';
        d.addEventListener('click', () => press(r, c));
        grid.appendChild(d);
      }
  }

  function press(r, c) {
    if (done) return;
    toggle(lit, r, c);
    moves++;
    $('moves').textContent = moves;
    render();
    if (lit.every(row => row.every(v => v))) {
      done = true;
      $('ov-msg').textContent = `${moves} 步完成` + (moves <= par ? ' · 最优解！👑' : `（参考 ${par} 步）`);
      setTimeout(() => $('overlay').classList.remove('hidden'), 350);
    }
  }

  $('level').addEventListener('change', init);
  $('restart').addEventListener('click', init);
  $('ov-btn').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
