<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>钢核防线</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --ind-bg: #0b1418;
    --ind-panel: #132228;
    --ind-line: #2a4a52;
    --ind-copper: #e08a3c;
    --ind-lead: #8b7bb8;
    --ind-core: #3dd6c6;
    --ind-accent: #7ee0ff;
  }

  body {
    background:
      radial-gradient(900px 500px at 15% -10%, #1a3a40 0%, transparent 55%),
      radial-gradient(700px 400px at 90% 10%, #2a2418 0%, transparent 50%),
      var(--ind-bg);
    font-family: "DIN Alternate", "Eurostile", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .game-page {
    max-width: 1000px;
    gap: 10px;
    padding: 12px;
  }

  .game-header h1 {
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--ind-core), var(--ind-accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hud .stat {
    background: var(--ind-panel);
    border-color: var(--ind-line);
    min-width: 72px;
  }
  .hud .stat .value.copper { color: var(--ind-copper); }
  .hud .stat .value.lead { color: var(--ind-lead); }
  .hud .stat .value.core { color: var(--ind-core); }

  #canvas-wrap {
    position: relative;
    width: min(96vw, 960px);
    border: 1px solid var(--ind-line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(61, 214, 198, 0.08), 0 16px 40px rgba(0, 0, 0, 0.35);
    background: #0b1418;
  }

  #game {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    cursor: crosshair;
  }

  .build-bar {
    width: min(96vw, 960px);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .build-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    min-width: 96px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--ind-line);
    background: var(--ind-panel);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
  }
  .build-btn:hover { border-color: var(--ind-core); transform: translateY(-1px); }
  .build-btn.active {
    border-color: var(--ind-core);
    background: #1a353c;
    box-shadow: inset 0 0 0 1px rgba(61, 214, 198, 0.35);
  }
  .build-btn.ghost { justify-content: center; align-items: center; min-width: 72px; color: var(--muted); }
  .build-btn .swatch {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    margin-bottom: 2px;
  }
  .build-btn .name { font-size: 0.82rem; font-weight: 600; }
  .build-btn .cost { font-size: 0.72rem; color: var(--muted); }

  .hint {
    max-width: 960px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.55;
  }
  .hint b { color: var(--ind-core); font-weight: 600; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(8, 16, 20, 0.82);
    backdrop-filter: blur(4px);
    z-index: 5;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: var(--ind-core);
  }
  .overlay p { color: var(--muted); max-width: 320px; }

  .tech-note {
    font-size: 0.75rem;
    color: #64748b;
    text-align: center;
    max-width: 960px;
  }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>钢核防线</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>

  <div class="hud">
    <div class="stat"><div class="label">铜</div><div class="value copper" id="res-copper">0</div></div>
    <div class="stat"><div class="label">铅</div><div class="value lead" id="res-lead">0</div></div>
    <div class="stat"><div class="label">波次</div><div class="value" id="stat-wave">0</div></div>
    <div class="stat"><div class="label">下一波</div><div class="value" id="stat-timer">—</div></div>
    <div class="stat"><div class="label">核心HP</div><div class="value core" id="stat-core">0</div></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="overlay hidden" id="overlay">
      <h2 id="ov-title"></h2>
      <p id="ov-msg"></p>
      <button class="btn" id="ov-btn">重新开始</button>
    </div>
  </div>

  <div class="build-bar" id="build-bar"></div>
  <p class="hint" id="hint"></p>
  <p class="tech-note">Canvas 2D · ES Modules 分系统架构 · 数据驱动建筑定义 · 零构建依赖</p>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
