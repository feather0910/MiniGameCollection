<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞机大战</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .board-wrap { width: min(92vw, 480px); }
  #board { width: 100%; height: auto; background: #05070f; border: 1px solid #334155; border-radius: var(--radius); }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>✈️ 飞机大战</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>
  <div class="hud">
    <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <div class="stat"><div class="label">生命</div><div class="value" id="lives">❤❤❤</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="640"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">飞机大战</h2>
      <p id="ov-msg">自动开火，移动战机躲避并击落敌机</p>
      <button class="btn" id="ov-btn">开始游戏</button>
    </div>
  </div>
  <p class="hint">电脑：移动鼠标控制战机 · 手机：屏幕任意位置滑动<br>紫色大型敌机更耐打、分数更高</p>
</div>
<script>
(() => {
  const W = 480, H = 640;
  const $ = id => document.getElementById(id);
  const cv = $('board'), ctx = cv.getContext('2d');
  const BEST_KEY = 'plane_best';
  let ship, bullets, enemies, particles, stars, score, lives, tick, playing = false, raf, invincible;
  $('best').textContent = localStorage.getItem(BEST_KEY) || 0;

  function reset() {
    ship = {x: W / 2, y: H - 80, w: 40, h: 46};
    bullets = []; enemies = []; particles = [];
    stars = Array.from({length: 60}, () => ({x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4}));
    score = 0; lives = 3; tick = 0; invincible = 0;
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('lives').textContent = '❤'.repeat(lives) || '—';
  }

  function spawnEnemy() {
    const big = Math.random() < 0.18;
    const r = big ? 26 : 15;
    enemies.push({
      x: r + Math.random() * (W - r * 2), y: -r * 2,
      r, hp: big ? 4 : 1, big,
      vy: (big ? 1.2 : 2.1) + Math.min(2.2, tick / 3000),
      vx: (Math.random() - 0.5) * 1.2
    });
  }

  function boom(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 3.5 + 1;
      particles.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 28, color});
    }
  }

  function step() {
    tick++;
    // 星空背景
    for (const s of stars) { s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    // 自动开火
    if (tick % 9 === 0) bullets.push({x: ship.x, y: ship.y - 26, vy: -9});
    // 敌机生成，随时间加快
    if (tick % Math.max(18, 46 - Math.floor(tick / 400)) === 0) spawnEnemy();

    bullets = bullets.filter(b => (b.y += b.vy) > -12);
    for (const e of enemies) { e.y += e.vy; e.x += e.vx; if (e.x < e.r || e.x > W - e.r) e.vx *= -1; }

    // 子弹命中
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
          e.hp--; b.dead = true;
          if (e.hp <= 0) {
            score += e.big ? 50 : 10;
            boom(e.x, e.y, e.big ? '#c084fc' : '#f87171');
            updateHud();
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
    // 敌机越界 / 撞机
    if (invincible > 0) invincible--;
    enemies = enemies.filter(e => {
      if (e.hp <= 0) return false;
      if (e.y > H + e.r * 2) return false;
      if (invincible <= 0 && Math.hypot(e.x - ship.x, e.y - ship.y) < e.r + 16) {
        boom(e.x, e.y, '#fbbf24');
        loseLife();
        return false;
      }
      return true;
    });
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05;
      return --p.life > 0;
    });
    draw();
    if (playing) raf = requestAnimationFrame(step);
  }

  function loseLife() {
    lives--;
    invincible = 90;
    updateHud();
    if (lives <= 0) gameOver();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#94a3b8';
    for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);
    // 子弹
    ctx.fillStyle = '#7dd3fc';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
    // 敌机
    for (const e of enemies) {
      ctx.fillStyle = e.big ? '#a855f7' : '#ef4444';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y + e.r);
      ctx.lineTo(e.x - e.r, e.y - e.r * 0.6);
      ctx.lineTo(e.x, e.y - e.r * 0.2);
      ctx.lineTo(e.x + e.r, e.y - e.r * 0.6);
      ctx.closePath();
      ctx.fill();
      if (e.big) {
        ctx.fillStyle = '#e9d5ff';
        ctx.fillRect(e.x - 3, e.y - 4, 6, 6);
      }
    }
    // 玩家战机（无敌时闪烁）
    if (invincible <= 0 || Math.floor(invincible / 6) % 2 === 0) {
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 24);
      ctx.lineTo(ship.x - 20, ship.y + 18);
      ctx.lineTo(ship.x, ship.y + 8);
      ctx.lineTo(ship.x + 20, ship.y + 18);
      ctx.closePath();
      ctx.fill();
      // 尾焰
      ctx.fillStyle = tick % 6 < 3 ? '#fbbf24' : '#fb923c';
      ctx.beginPath();
      ctx.moveTo(ship.x - 5, ship.y + 14);
      ctx.lineTo(ship.x, ship.y + 26 + Math.random() * 5);
      ctx.lineTo(ship.x + 5, ship.y + 14);
      ctx.closePath();
      ctx.fill();
    }
    // 爆炸粒子
    for (const p of particles) {
      ctx.globalAlpha = p.life / 28;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function gameOver() {
    playing = false;
    cancelAnimationFrame(raf);
    const best = Math.max(score, +(localStorage.getItem(BEST_KEY) || 0));
    localStorage.setItem(BEST_KEY, best);
    $('best').textContent = best;
    $('ov-title').textContent = '💥 战机坠毁';
    $('ov-msg').textContent = `得分 ${score}`;
    $('ov-btn').textContent = '再来一局';
    $('overlay').classList.remove('hidden');
  }

  function start() {
    reset();
    playing = true;
    $('overlay').classList.add('hidden');
    raf = requestAnimationFrame(step);
  }

  function moveTo(clientX, clientY) {
    const rect = cv.getBoundingClientRect();
    ship.x = Math.max(20, Math.min(W - 20, (clientX - rect.left) / rect.width * W));
    ship.y = Math.max(H / 2, Math.min(H - 30, (clientY - rect.top) / rect.height * H));
  }

  cv.addEventListener('mousemove', e => { if (playing) moveTo(e.clientX, e.clientY); });
  // 触屏：任意位置相对滑动
  let lt = null;
  document.addEventListener('touchstart', e => {
    if (!playing || e.target.closest?.('a, button')) return;
    lt = e.touches[0];
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (!playing || !lt) return;
    e.preventDefault();
    const t = e.touches[0];
    const rect = cv.getBoundingClientRect();
    const scale = W / rect.width;
    ship.x = Math.max(20, Math.min(W - 20, ship.x + (t.clientX - lt.clientX) * scale));
    ship.y = Math.max(H / 2, Math.min(H - 30, ship.y + (t.clientY - lt.clientY) * scale));
    lt = t;
  }, {passive: false});
  document.addEventListener('touchend', () => { lt = null; });

  $('ov-btn').addEventListener('click', start);
  reset();
  draw();
})();
</script>
</body>
</html>
