<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .board-wrap { width: min(92vw, 480px); }
  #board { width: 100%; height: auto; background: #0b1120; border: 1px solid #334155; border-radius: var(--radius); }
</style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <h1>🐍 贪吃蛇</h1>
    <a class="back-link" href="../../">← 返回大厅</a>
  </div>
  <div class="hud">
    <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <div class="stat"><div class="label">长度</div><div class="value" id="len">3</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">贪吃蛇</h2>
      <p id="ov-msg">方向键 / WASD / 滑动屏幕控制方向</p>
      <button class="btn" id="ov-btn">开始游戏</button>
    </div>
  </div>
  <p class="hint">电脑：方向键或 WASD 控制，空格暂停<br>手机：在棋盘上滑动改变方向</p>
</div>
<script>
(() => {
  const N = 24, CELL = 480 / N;
  const cv = document.getElementById('board'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const BEST_KEY = 'snake_best';

  let snake, dir, nextDir, food, score, timer, speed, playing = false, paused = false;
  $('best').textContent = localStorage.getItem(BEST_KEY) || 0;

  function reset() {
    snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 140;
    placeFood();
    updateHud();
  }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)};
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateHud() {
    $('score').textContent = score;
    $('len').textContent = snake.length;
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      placeFood();
      if (speed > 60) { speed -= 3; restartTimer(); }
    } else {
      snake.pop();
    }
    updateHud();
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, 480, 480);
    // 食物
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2.4, 0, Math.PI * 2);
    ctx.fill();
    // 蛇身
    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#34d399' : `hsl(${160 - t * 40}, 70%, ${55 - t * 18}%)`;
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    });
    // 眼睛
    const h = snake[0];
    ctx.fillStyle = '#0b1120';
    const ex = h.x * CELL + CELL / 2 + dir.x * 4, ey = h.y * CELL + CELL / 2 + dir.y * 4;
    ctx.beginPath();
    ctx.arc(ex - dir.y * 4, ey - dir.x * 4, 2.2, 0, Math.PI * 2);
    ctx.arc(ex + dir.y * 4, ey + dir.x * 4, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function start() {
    reset();
    playing = true;
    paused = false;
    $('overlay').classList.add('hidden');
    draw();
    restartTimer();
  }

  function gameOver() {
    clearInterval(timer);
    playing = false;
    const best = Math.max(score, +(localStorage.getItem(BEST_KEY) || 0));
    localStorage.setItem(BEST_KEY, best);
    $('best').textContent = best;
    $('ov-title').textContent = '游戏结束';
    $('ov-msg').textContent = `得分 ${score} · 长度 ${snake.length}`;
    $('ov-btn').textContent = '再来一局';
    $('overlay').classList.remove('hidden');
  }

  function setDir(x, y) {
    if (!playing || paused) return;
    if (x === -dir.x && y === -dir.y) return; // 不能掉头
    nextDir = {x, y};
  }

  function togglePause() {
    if (!playing) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      $('ov-title').textContent = '已暂停';
      $('ov-msg').textContent = '按空格或点击按钮继续';
      $('ov-btn').textContent = '继续';
      $('overlay').classList.remove('hidden');
    } else {
      $('overlay').classList.add('hidden');
      restartTimer();
    }
  }

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
    else if (k === ' ') playing ? togglePause() : start();
  });

  let touchStart = null;
  cv.addEventListener('touchstart', e => { touchStart = e.touches[0]; }, {passive: true});
  cv.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
    else setDir(0, Math.sign(dy));
    touchStart = null;
  });

  $('ov-btn').addEventListener('click', () => (playing && paused) ? togglePause() : start());
  reset();
  draw();
})();
</script>
</body>
</html>
